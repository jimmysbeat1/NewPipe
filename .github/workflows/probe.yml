name: probe film apis
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="PipeHomeProbe/0.1 (https://github.com/jimmysbeat1/NewPipe)"
          g() { local n="$1" u="$2"; shift 2; local a=(); for p in "$@"; do a+=(--data-urlencode "$p"); done; echo "##### $n" >&2; sleep 1; curl -sS -m 60 -A "$UA" -G "$u" "${a[@]}"; }
          exec 2>&1
          C=https://commons.wikimedia.org/w/api.php
          Q=(action=query format=json formatversion=2)
          for c in 'Videos of feature films' 'Videos of films by length' 'Videos of films by genre' 'Videos of films in the public domain' 'Videos of films by decade' 'Videos of film segments' 'Videos of feature films by decade' 'Videos of feature films by country' 'Videos of feature films by genre' 'Feature films' 'Videos of comedy films' 'Videos of horror films'; do
            g "members $c" $C "${Q[@]}" list=categorymembers "cmtitle=Category:$c" 'cmtype=subcat' cmlimit=80 | jq -c '[.query.categorymembers[]?.title]'
            g "search count deepcat $c" $C "${Q[@]}" list=search srnamespace=6 srlimit=1 srinfo=totalhits "srsearch=filetype:video filesize:>50000 deepcat:\"$c\"" | jq -c '.warnings, .query.searchinfo'
          done
          for s in 'filetype:video deepcat:"Videos of feature films"' 'filetype:video deepcat:"Videos of feature films" chaplin' 'filetype:video deepcat:"Videos of feature films" deepcat:"Comedy films"' 'filetype:video deepcat:"Videos of feature films" incategory:"Comedy films"'; do
            g "search $s" $C "${Q[@]}" generator=search gsrnamespace=6 gsrlimit=20 "gsrsearch=$s" gsrsort=incoming_links_desc prop=videoinfo 'viprop=url|size|mime|extmetadata|derivatives' viurlwidth=400 'viextmetadatafilter=LicenseShortName|LicenseUrl|License|Copyrighted|Categories|DateTimeOriginal|ObjectName|Artist|Restrictions' | jq -c '.error, .warnings, .continue, .batchcomplete, (.query.pages // [] | sort_by(.index)[] | {title, index, d: .videoinfo[0].duration, h: .videoinfo[0].height, size: .videoinfo[0].size, mime: .videoinfo[0].mime, em: (.videoinfo[0].extmetadata|map_values(.value)), der: [.videoinfo[0].derivatives[]? | {k: .transcodekey, h: .height, b: .bandwidth, t: .type}], thumb: .videoinfo[0].thumburl, url: .videoinfo[0].url})'
          done
          echo "##### IA dl"; curl -sSIL -A "$UA" -r 0-99 "https://archive.org/download/sex_madness/sex_madness.mp4" | grep -iE '^(HTTP|location|content-(type|length|range)|accept-ranges|etag)'
          echo "##### IA img"; curl -sSIL -A "$UA" https://archive.org/services/img/sex_madness | grep -iE '^(HTTP|location|content-(type|length))'
          echo "##### commons dl"; curl -sSIL -A "$UA" -r 0-99 "https://upload.wikimedia.org/wikipedia/commons/transcoded/c/c0/Big_Buck_Bunny_4K.webm/Big_Buck_Bunny_4K.webm.240p.vp9.webm" | grep -iE '^(HTTP|location|content-(type|length|range)|accept-ranges|etag)'
          g "IA search page+fields" https://archive.org/advancedsearch.php 'q=mediatype:movies AND collection:feature_films AND licenseurl:http*creativecommons.org* AND -collection:short_films AND (title:(general) OR subject:(general))' rows=5 page=1 'sort[]=downloads desc' output=json 'fl[]=identifier' 'fl[]=title' 'fl[]=licenseurl' 'fl[]=runtime' 'fl[]=year' 'fl[]=subject' 'fl[]=downloads' | jq -c '.response.numFound, .response.docs[]'
          g "IA scifi" https://archive.org/advancedsearch.php 'q=mediatype:movies AND collection:feature_films AND licenseurl:http*creativecommons.org* AND -collection:short_films AND (collection:(SciFi_Horror OR film_scifi) OR subject:("sci-fi" OR "science fiction"))' rows=3 output=json 'fl[]=identifier' 'fl[]=subject' | jq -c '.response.numFound, .response.docs[]'
          exit 0
