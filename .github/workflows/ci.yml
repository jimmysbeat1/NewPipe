name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - master
      - refactor
      - release**
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - dev
      - master
      - 'claude/**'
      - 'feature/**'
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-test-jvm:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: create and checkout branch
        # push events already checked out the branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: git checkout -B "$BRANCH"

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      # Optional: sign the APK with your own key so that successive builds can update each
      # other. Configure the four PIPEHOME_* repository secrets described in doc/pipehome.md.
      # Without them the APK is signed with a throwaway debug key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PIPEHOME_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pipehome.jks"
          echo "PIPEHOME_KEYSTORE_FILE=$RUNNER_TEMP/pipehome.jks" >> "$GITHUB_ENV"

      - name: Build APK, run lint and jvm tests
        env:
          PIPEHOME_KEYSTORE_PASSWORD: ${{ secrets.PIPEHOME_KEYSTORE_PASSWORD }}
          PIPEHOME_KEY_ALIAS: ${{ secrets.PIPEHOME_KEY_ALIAS }}
          PIPEHOME_KEY_PASSWORD: ${{ secrets.PIPEHOME_KEY_PASSWORD }}
        run: ./gradlew assembleContinuous lintContinuous testDebugUnitTest --stacktrace -DskipFormatKtlint

      - name: Rename APK
        run: |
          VERSION_NAME="$(jq -r ".elements[0].versionName" app/build/outputs/apk/continuous/output-metadata.json)"
          mv app/build/outputs/apk/continuous/*.apk "app/build/outputs/apk/continuous/PipeHome_v${VERSION_NAME}_${GITHUB_SHA::7}.apk"
          rm -f "$RUNNER_TEMP/pipehome.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PipeHome-apk
          path: app/build/outputs/apk/continuous/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/**
            shared/build/reports/**
          if-no-files-found: ignore

  # The debuggable build (application id ends in .debug, installs next to the other one). It is
  # built on its own: together with the optimised build the Gradle daemon runs out of memory.
  build-debug-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace -DskipFormatKtlint

      - name: Rename APK
        run: |
          VERSION_NAME="$(jq -r ".elements[0].versionName" app/build/outputs/apk/debug/output-metadata.json)"
          mv app/build/outputs/apk/debug/*.apk "app/build/outputs/apk/debug/PipeHome_debug_v${VERSION_NAME}_${GITHUB_SHA::7}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: PipeHome-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # End-to-end check of the film library against the real Internet Archive and Wikimedia
  # Commons, including real downloads. It depends on services outside of this repository, so a
  # failure is reported but does not fail the workflow.
  film-sources-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Run live film library tests
        env:
          PIPEHOME_LIVE_TESTS: 1
        run: |
          export PIPEHOME_LIVE_REPORT="$RUNNER_TEMP/film-library-live.txt"
          ./gradlew :app:testDebugUnitTest --tests "*FilmSourcesLiveTest*" --stacktrace -DskipFormatKtlint

      - name: Show what the sources returned
        if: always()
        run: cat "$RUNNER_TEMP/film-library-live.txt" || true

      - name: Upload live test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: film-library-live-report
          path: |
            ${{ runner.temp }}/film-library-live.txt
            app/build/reports/tests/**
          if-no-files-found: ignore

  # End-to-end check of the movie discovery against the real TMDB API. It only does something
  # when the repository secret PIPEHOME_TMDB_KEY holds a TMDB key (see doc/modern-movies.md);
  # without it the tests are skipped. The key is used by the tests only: it is never built into
  # an APK. A failure is reported but does not fail the workflow.
  tmdb-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Run live TMDB tests
        env:
          PIPEHOME_TMDB_KEY: ${{ secrets.PIPEHOME_TMDB_KEY }}
        run: |
          export PIPEHOME_LIVE_REPORT="$RUNNER_TEMP/tmdb-live.txt"
          if [ -z "$PIPEHOME_TMDB_KEY" ]; then
            echo "PIPEHOME_TMDB_KEY is not configured: the live TMDB tests are skipped." | tee "$PIPEHOME_LIVE_REPORT"
          fi
          ./gradlew :app:testDebugUnitTest --tests "*TmdbLiveTest*" --stacktrace -DskipFormatKtlint

      - name: Show what TMDB returned
        if: always()
        run: cat "$RUNNER_TEMP/tmdb-live.txt" || true

      - name: Upload live test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tmdb-live-report
          path: ${{ runner.temp }}/tmdb-live.txt
          if-no-files-found: ignore

  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - api-level: 23
            target: default
            arch: x86
          - api-level: 35
            target: default
            arch: x86_64

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Run android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          script: ./gradlew connectedCheck --stacktrace

      - name: Show failed tests
        if: failure()
        run: |
          # the console only says that tests failed, not which ones and why
          find app/build/outputs/androidTest-results -name '*.xml' -print0 2>/dev/null \
            | xargs -0 -r grep -h -A 25 -E '<(failure|error)' | cut -c1-600 | head -150 || true
          find app/build/outputs/androidTest-results -name 'logcat-*.txt' -print0 2>/dev/null \
            | xargs -0 -r grep -h -B 2 -A 30 'FATAL EXCEPTION' | head -120 || true

      - name: Upload test report when tests fail # because the printed out stacktrace (console) is too short, see also #7553
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/**

  sonar:
    if: ${{ false }} # the key has expired and needs to be regenerated by the sonar admins
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar --info
